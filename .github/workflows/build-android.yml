name: Build Android App

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission for Gradlew
        run: chmod +x mobile/android/gradlew

      - name: Build Android APKs (Debug & Release)
        working-directory: mobile/android
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OfflineMeshCalling-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OfflineMeshCalling-release-apk
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Job Summary
        run: |
          echo "### 🚀 Android Build Completed Successfully!" >> $GITHUB_STEP_SUMMARY
          echo "Signed with permanent deterministic keystore. In-place updates and APK upgrades will now install seamlessly without package conflicts!" >> $GITHUB_STEP_SUMMARY
