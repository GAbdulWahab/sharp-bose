name: Build Desktop App (Online Build)

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build-windows-desktop:
    name: Build Windows Desktop App (.exe)
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: desktop/package.json

      - name: Install Desktop Dependencies
        working-directory: desktop
        run: npm ci || npm install

      - name: Build Windows Executable (.exe)
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          WIN_CODE_SIGNING_DISABLED: "true"
        run: npm run dist

      - name: Upload Windows Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SharpBoseTacticalMesh-Windows-Portable-Exe
          path: desktop/dist/*.exe
          retention-days: 30

      - name: Job Summary
        run: |
          echo "### 🚀 Desktop Online Build Completed Successfully!" >> $env:GITHUB_STEP_SUMMARY
          echo "Standalone portable Windows desktop executable has been built and uploaded as a GitHub artifact." >> $env:GITHUB_STEP_SUMMARY
