plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def getAppVersionCode() {
    def runNumber = System.getenv("GITHUB_RUN_NUMBER")
    if (runNumber != null && runNumber.isInteger()) {
        return 100 + Integer.parseInt(runNumber)
    }
    return 100
}

def getAppVersionName() {
    def runNumber = System.getenv("GITHUB_RUN_NUMBER")
    if (runNumber != null) {
        return "1.0." + runNumber
    }
    return "1.0.0"
}

android {
    namespace 'com.offline.calling'
    compileSdk 35

    defaultConfig {
        applicationId "com.offline.calling"
        minSdk 29
        targetSdk 35
        versionCode getAppVersionCode()
        versionName getAppVersionName()

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            storeFile file('offline_mesh.keystore')
            storePassword 'androidpassword'
            keyAlias 'offline_mesh_key'
            keyPassword 'androidpassword'
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            signingConfig signingConfigs.release
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding false
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
